<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙연산 계산기</title>
</head>
<body>

    <!-- 계산기 전체 감싸는 틀 -->
    <div class="calculator">
        
        <!-- 디스플레이 (결과 및 입력창) -->
        <div class="calculator-display">
            <input type="text" id="display" value="0" readonly>
        </div>

        <!-- 버튼 패드 -->
        <div class="calculator-buttons">
            <!-- 기능 버튼 라인 -->
            <button type="button" class="btn-clear">C</button>
            <button type="button" class="btn-toggle">+/-</button>
            <button type="button" class="btn-percent">%</button>
            <button type="button" class="btn-operator">/</button>

            <!-- 7, 8, 9, 곱하기 -->
            <button type="button" class="btn-number">7</button>
            <button type="button" class="btn-number">8</button>
            <button type="button" class="btn-number">9</button>
            <button type="button" class="btn-operator">*</button>

            <!-- 4, 5, 6, 빼기 -->
            <button type="button" class="btn-number">4</button>
            <button type="button" class="btn-number">5</button>
            <button type="button" class="btn-number">6</button>
            <button type="button" class="btn-operator">-</button>

            <!-- 1, 2, 3, 더하기 -->
            <button type="button" class="btn-number">1</button>
            <button type="button" class="btn-number">2</button>
            <button type="button" class="btn-number">3</button>
            <button type="button" class="btn-operator">+</button>

            <!-- 0, 소수점, 등호 -->
            <!-- 일반적인 계산기는 '0' 버튼이 가로로 넓은 경우가 많습니다 -->
            <button type="button" class="btn-number btn-zero">0</button>
            <button type="button" class="btn-dot">.</button>
            <button type="button" class="btn-equals">=</button>
        </div>

    </div>

</body>
</html>
